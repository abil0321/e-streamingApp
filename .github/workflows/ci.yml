name: CI Laravel & React

on:
  push:
    branches: ["*"] # <--- Tanda bintang artinya "SEMUA branch"
  pull_request:
    branches: ["*"]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Test Backend (Laravel)
  # ------------------------------------------------------------------
  laravel-tests:
    runs-on: ubuntu-latest

    # 🔥 INI BAGIAN BARU: Kita buat container Postgres khusus untuk testing
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: e-streamingapp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ganteng321
        ports:
          - 5432:5432
        # Cek kesehatan DB sebelum lanjut (agar tidak error connection refused)
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4" # Sesuaikan versi PHP Laragon Anda
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, dom, fileinfo

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate Key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      # 🔥 KITA UBAH BAGIAN INI: Menggunakan Postgres service di atas
      - name: Run Migrations & Execute Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: e-streamingapp
          DB_USERNAME: postgres
          DB_PASSWORD: ganteng321
        run: |
          php artisan migrate --force
          php artisan test

  # ------------------------------------------------------------------
  # JOB 2: Cek Frontend (React + pnpm)
  # ------------------------------------------------------------------
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Langkah penting: Install pnpm di environment GitHub Actions
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10 # Menggunakan pnpm versi terbaru

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      # Jika build gagal, berarti ada error di React code Anda
      - name: Try Build
        run: pnpm build
